[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
warn_unused_configs = True

# Exclusions: exclude test files (they often have duplicate names and relaxed typing)
# Focus type checking on production code (python_app/)
exclude = (venv|\.venv|ENV|env|build|dist|__pycache__|tests/.*|.*test.*\.py)

# Flask has dynamic attributes that mypy can't resolve without type stubs
# We use ignore_missing_imports=True, but Flask's Blueprint, Response, etc.
# are runtime attributes that mypy can't see in the Flask module
[mypy-flask.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
