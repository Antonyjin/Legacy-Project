name: CI

# Note: Uses macOS runner since repo includes prebuilt macOS binaries
# For Linux support, binaries would need to be built from source
# Public repos have unlimited Actions minutes, so no cost concern

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-latest
    name: GeneWeb Tests (macOS)
    env:
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check if we need to build from source
        id: check_source
        run: |
          if [ -d "GeneWeb" ]; then
            echo "has_binaries=true" >> $GITHUB_OUTPUT
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "✅ GeneWeb binaries found"
          elif [ -d "source_geneweb" ]; then
            echo "has_binaries=false" >> $GITHUB_OUTPUT
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "🔨 Will build GeneWeb from source"
          else
            echo "has_binaries=false" >> $GITHUB_OUTPUT
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "⚠️ No GeneWeb found - skipping OCaml tests"
          fi

      - name: Setup OCaml
        if: steps.check_source.outputs.needs_build == 'true'
        uses: ocaml/setup-ocaml@v3.4.0
        with:
          ocaml-compiler: 4.14.2

      - name: Install GeneWeb dependencies
        if: steps.check_source.outputs.needs_build == 'true'
        working-directory: source_geneweb
        run: |
          opam install . --deps-only --with-test
        env:
          OPAMYES: true

      - name: Configure GeneWeb
        if: steps.check_source.outputs.needs_build == 'true'
        working-directory: source_geneweb
        run: |
          opam exec -- ocaml ./configure.ml --sosa-zarith

      - name: Build GeneWeb
        if: steps.check_source.outputs.needs_build == 'true'
        working-directory: source_geneweb
        run: |
          opam exec -- make distrib
          echo "✅ Build complete"

      - name: Setup GeneWeb runtime from distribution
        if: steps.check_source.outputs.needs_build == 'true'
        run: |
          # The 'make distrib' creates a 'distribution' folder
          # Move it to GeneWeb/ for tests
          if [ -d "source_geneweb/distribution" ]; then
            mv source_geneweb/distribution GeneWeb
            echo "✅ GeneWeb runtime ready from distribution"
          else
            echo "❌ Distribution folder not found"
            exit 1
          fi
          
          # Note: Test database (test.gwb) should already be in the repo
          # If not found, tests will fail gracefully
          if [ -d "GeneWeb/bases/test.gwb" ]; then
            echo "✅ Test database found"
          else
            echo "⚠️ Test database not found - some tests may fail"
          fi

      - name: Make executables
        if: steps.check_source.outputs.has_binaries == 'true' || steps.check_source.outputs.needs_build == 'true'
        run: |
          chmod +x GeneWeb/gw/* || true
          chmod +x scripts/golden/run_golden.sh || true
          chmod +x scripts/golden/test_gedcom_import.sh || true

      # ==========================================
      # OCaml/GeneWeb Tests
      # ==========================================

      - name: Smoke test gwd
        if: steps.check_source.outputs.has_binaries == 'true' || steps.check_source.outputs.needs_build == 'true'
        working-directory: GeneWeb
        run: |
          set -e
          ./gw/gwd -hd ./gw -bd ./bases -p 23179 -lang en > gwd.out 2>&1 &
          GWD_PID=$!
          sleep 3
          # Quick smoke: just verify gwd is serving (golden tests will do full validation)
          set +e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:23179/test)
          if [ "$CODE" != "200" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:23179/base)
          fi
          set -e
          # Accept server up if not 5xx/000
          if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then
            echo "Smoke check failed (HTTP $CODE). Tail of gwd.out:"
            tail -n 100 gwd.out || true
            kill "$GWD_PID" 2>/dev/null || true
            exit 1
          fi
          # Determine base URL for content checks
          URL=http://localhost:23179/test
          if [ "$CODE" != "200" ]; then URL=http://localhost:23179/base; fi
          # Home page contains marker
          curl -sf "$URL" | grep -qi "geneweb" || { echo "Marker not found on home"; tail -n 100 gwd.out; kill "$GWD_PID" 2>/dev/null || true; exit 1; }
          # Person page (Charles Windsor): 200 + key markers
          PERSON_URL="${URL}?p=Charles&n=Windsor"
          if ! curl -sf "$PERSON_URL" | grep -qiE "name|person|id"; then
            echo "Person page markers missing on $PERSON_URL"
            tail -n 100 gwd.out || true
            kill "$GWD_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Person page check passed"
          # FR Localization: Check French text appears when lang=fr
          FR_URL="${URL}?lang=fr"
          if ! curl -sf "$FR_URL" | grep -qiE "Accueil|Personne|Famille"; then
            echo "FR localization check failed on $FR_URL"
            tail -n 100 gwd.out || true
            kill "$GWD_PID" 2>/dev/null || true
            exit 1
          fi
          echo "FR localization check passed"
          # Logging: Check gwd.log exists and has no critical errors
          if [ ! -f gwd.out ]; then
            echo "Logging check failed: gwd.out not found"
            exit 1
          fi
          if grep -qiE "fatal|exception|stack" gwd.out; then
            echo "Logging check failed: critical errors found in gwd.out"
            grep -iE "fatal|exception|stack" gwd.out || true
            kill "$GWD_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Logging check passed (no critical errors)"
          # Note: Tree and search pages require Sosa reference configuration (via gwsetup)
          # which is not part of the minimal test database. Skipping these checks in CI.
          # Golden tests already validate core rendering behavior.
          echo "gwd smoke check passed (HTTP $CODE)"
          kill "$GWD_PID" 2>/dev/null || true

      - name: Export GEDCOM test
        if: steps.check_source.outputs.has_binaries == 'true' || steps.check_source.outputs.needs_build == 'true'
        working-directory: GeneWeb
        run: |
          set -e
          # Export GEDCOM from test.gwb (or base.gwb if test doesn't exist)
          if [ -d bases/test.gwb ]; then
            BASE_PATH="bases/test.gwb"
          elif [ -d bases/base.gwb ]; then
            BASE_PATH="bases/base.gwb"
          else
            echo "Export check failed: no test.gwb or base.gwb found"
            exit 1
          fi
          # Run gwb2ged export
          ./gw/gwb2ged "$BASE_PATH" -o /tmp/export_test.ged
          # Check file exists and has content
          if [ ! -f /tmp/export_test.ged ]; then
            echo "Export check failed: output file not created"
            exit 1
          fi
          FILE_SIZE=$(wc -c < /tmp/export_test.ged)
          if [ "$FILE_SIZE" -eq 0 ]; then
            echo "Export check failed: output file is empty"
            exit 1
          fi
          echo "Export check passed (file size: $FILE_SIZE bytes)"
          rm -f /tmp/export_test.ged

      # ==========================================
      # Golden Tests - DISABLED until after migration
      # ==========================================
      # Strategy: 1) Build Python tests → 2) Migrate → 3) Take OCaml snapshots → 4) Run Python → 5) Compare
      # These will be re-enabled in Week 2-3 after migration starts
      
      # - name: Golden validate (HTML pages)
      #   if: steps.check_source.outputs.has_binaries == 'true' || steps.check_source.outputs.needs_build == 'true'
      #   run: |
      #     chmod +x ./scripts/golden/run_golden.sh || true
      #     bash ./scripts/golden/run_golden.sh validate

      # - name: GEDCOM import roundtrip test
      #   if: steps.check_source.outputs.has_binaries == 'true' || steps.check_source.outputs.needs_build == 'true'
      #   run: |
      #     chmod +x ./scripts/golden/test_gedcom_import.sh || true
      #     bash ./scripts/golden/test_gedcom_import.sh validate

      # ==========================================
      # Python Tests
      # ==========================================

      - name: Python infrastructure test
        run: |
          pytest tests/python/unit/test_setup.py -v
        continue-on-error: false  # Infrastructure must work

      - name: Python unit tests
        run: |
          pytest tests/python/unit/ -v --tb=short -m unit || true
        continue-on-error: true  # Allow failures during Week 1 implementation

      - name: Python integration tests
        run: |
          pytest tests/python/integration/ -v --tb=short -m integration || true
        continue-on-error: true  # Allow failures during Week 1-2 implementation

      - name: Python functional tests
        run: |
          pytest tests/python/functional/ -v --tb=short -m functional || true
        continue-on-error: true  # Allow failures during Week 2-3 implementation

      - name: Python coverage report
        if: always()
        run: |
          pytest tests/python/ --cov=tests/python --cov-report=xml --cov-report=html --cov-report=term || true

      # ==========================================
      # Upload Artifacts
      # ==========================================

      - name: Upload golden diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: |
            tests/golden/reports/diff.txt
            tests/golden/reports/import_diff.txt
          if-no-files-found: ignore

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            tests/python/htmlcov/
          if-no-files-found: ignore

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: tests/python/pytest.log
          if-no-files-found: ignore
